name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload artifacts for"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (Linux x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libgtk-3-dev libssl-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libx11-dev libxext-dev libxft-dev \
            libxinerama-dev libxcursor-dev libxrender-dev \
            libxfixes-dev libxi-dev libxtst-dev

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          NAME="G4Patcher-${{ github.event.inputs.tag || github.ref_name }}-linux-x86_64"
          mkdir "$NAME"
          cp target/release/G4Patcher "$NAME/"
          cp -r patches "$NAME/patches"
          tar -czf "${NAME}.tar.gz" "$NAME"

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: G4Patcher-${{ github.event.inputs.tag || github.ref_name }}-linux-x86_64.tar.gz
          fail_on_unmatched_files: true

  build-macos:
    name: Build (macOS aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install CMake and Ninja
        run: brew install cmake ninja

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          NAME="G4Patcher-${{ github.event.inputs.tag || github.ref_name }}-macos-aarch64"
          mkdir "$NAME"
          cp target/release/G4Patcher "$NAME/"
          cp -r patches "$NAME/patches"
          tar -czf "${NAME}.tar.gz" "$NAME"

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: G4Patcher-${{ github.event.inputs.tag || github.ref_name }}-macos-aarch64.tar.gz
          fail_on_unmatched_files: true

  build-windows:
    name: Build (Windows x86-64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Enable Windows long paths
        run: git config --global core.longpaths true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $name = "G4Patcher-${{ github.event.inputs.tag || github.ref_name }}-windows-x86_64"
          New-Item -ItemType Directory "$name"
          Copy-Item "target/release/G4Patcher.exe" "$name/"
          Copy-Item -Recurse "patches" "$name"
          Compress-Archive -Path "$name/*" -DestinationPath "${name}.zip"

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: G4Patcher-${{ github.event.inputs.tag || github.ref_name }}-windows-x86_64.zip
          fail_on_unmatched_files: true
