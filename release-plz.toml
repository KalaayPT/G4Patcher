[workspace]
# G4Patcher is a binary GUI tool, not published to crates.io.
# git_only determines the current version from git tags instead of the
# crates.io registry, but it does NOT skip `cargo publish` on its own
# (despite what the release-plz docs imply): publish defaults to true and
# must be disabled explicitly, or the release fails with "no token found".
git_only = true
publish = false

# Skip semver checks. cargo-semver-checks runs `cargo package` under the hood,
# whose verification build copies the crate into an isolated dir that does not
# contain the `armips/` git submodule, panicking build.rs. The tool is a binary
# with no library API anyway, so semver is meaningless here.
semver_check = false

# Emit a `v{version}` tag and GitHub release, which the tag-triggered
# release.yml picks up to build and attach the platform binaries.
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
